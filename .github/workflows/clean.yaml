name: Nexus Watermark Cleaner Bot (C++)

on:
  schedule:
    # Run automatically every 1 hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Number of chapters to clean per run'
        required: false
        default: '120'
      data_repo:
        description: 'Target Data Repository (owner/repo)'
        required: false
        default: 'zxiu86/Data'
      branch:
        description: 'Branch name for Data Repository'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: cleaner-bot
  cancel-in-progress: false

jobs:
  clean_and_sync:
    name: Clean Watermarks & Sync Coordinates to Data Repo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Step 1: Checkout the App Repository (to get the C++ source code)
      - name: Checkout App Repository (Nexus)
        uses: actions/checkout@v4
        with:
          path: nexus_app

      # Step 2: Checkout the Data Repository (where data/ and coordinates/ live)
      - name: Checkout Data Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.data_repo || 'zxiu86/Data' }}
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.DATA_REPO_TOKEN || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          path: data_repo

      # Step 3: Install C++ Build Tools & Tesseract OCR
      - name: Install C++ Build Tools, Leptonica & Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential \
            g++ \
            libcurl4-openssl-dev \
            tesseract-ocr \
            tesseract-ocr-eng \
            libtesseract-dev \
            libleptonica-dev

      # Step 4: Compile C++ Cleaner Bot
      - name: Compile C++ Cleaner Bot
        run: |
          mkdir -p bin
          g++ -O3 -std=c++17 nexus_app/tools/cleaner_bot.cpp \
            -lcurl \
            -ltesseract \
            -llept \
            -lpthread \
            -o bin/cleaner_bot
          chmod +x bin/cleaner_bot

      # Step 5: Run Watermark Cleaner against Data Repository
      - name: Run Watermark Cleaner (Batch 120 Chapters)
        env:
          BATCH_LIMIT: ${{ github.event.inputs.batch_limit || '120' }}
          DATA_DIR: 'data_repo/data'
          COORDS_DIR: 'data_repo/coordinates'
        run: |
          ./bin/cleaner_bot "$BATCH_LIMIT" "$DATA_DIR" "$COORDS_DIR"

      # Step 6: Commit and Push Coordinates directly to the Data Repository
      - name: Commit and Push Coordinates to Data Repo
        working-directory: data_repo
        run: |
          git config user.name "Nexus Watermark Bot"
          git config user.email "bot@nexus.app"
          
          # Add coordinates folder in the root next to data/
          if [ -d "coordinates" ]; then
            git add coordinates/
          fi
          
          if git diff --staged --quiet; then
            echo "✅ No new coordinates to commit. Everything is up to date."
          else
            git commit -m "🤖 [Bot] Cleaned & added watermark coordinates for chapters [Batch limit: ${{ github.event.inputs.batch_limit || '120' }}]"
            git push origin HEAD:${{ github.event.inputs.branch || 'main' }}
            echo "🚀 Coordinates pushed successfully to Data repository (root/coordinates/)!"
          fi
