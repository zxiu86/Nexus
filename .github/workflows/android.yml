name: Nexus Android CI/CD Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK (Auto Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug

      - name: Extract Version Info
        id: version_step
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' || echo "1.1")
          if [ -z "$VERSION" ]; then VERSION="1.1"; fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Detected App Version: $VERSION, Target Release Tag: $TAG"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-app-v1.1-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Nexus Manga v${{ env.VERSION_NAME }}"
          body: |
            ## 🚀 إصدار جديد لتطبيق Nexus Manga (${{ env.RELEASE_TAG }})
            
            - تحديث نظام جلب البيانات والتوافق الكامل مع مستودع `Data`.
            - تحسين قارئ الفصول للمانها والمانهوا الطولية بدقة كاملة.
            - دعم نظام التحديث الديناميكي التلقائي من داخل التطبيق.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
